<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra từ vựng Unit 6 &amp; 7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1f1338;color:#f7f2ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}main{max-width:1040px;margin:auto;padding:24px 18px 80px}.back{color:#ddd2ff;text-decoration:none;font-weight:700}.back:hover{text-decoration:underline}header{margin:32px 0 24px}.eyebrow{color:#ffbc4d;font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.15;color:#ffd184;margin:8px 0}header p{color:#d4cbea;margin:10px 0}.progress{display:flex;align-items:center;gap:12px;margin-top:20px;color:#d4cbea;font-size:.9rem}.bar{height:9px;background:#44325e;border-radius:20px;flex:1;overflow:hidden}.bar span{display:block;background:#ffb542;height:100%;width:0;transition:width .2s}.unit-heading{display:flex;align-items:center;gap:12px;margin:32px 0 12px;color:#ffd184;font-size:1.25rem}.unit-heading span{font-size:.85rem;color:#c6b9dc;font-weight:500}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#2a1a45;border:1px solid #6555ac;border-radius:17px;padding:18px;min-width:0}.clue{display:flex;gap:12px;align-items:center;min-height:54px;margin-bottom:14px}.icon{display:grid;place-items:center;flex:none;width:52px;height:52px;border-radius:15px;background:#3b285b;font-size:1.7rem}.meaning{font-weight:750;font-size:1rem}label{display:block;color:#d2c5e9;font-size:.82rem;margin-bottom:5px}input{display:block;width:100%;border:2px solid #655687;border-radius:10px;background:#1b1030;color:#fff;font:inherit;padding:11px 12px;outline:none}input:focus{border-color:#ffc25c;box-shadow:0 0 0 3px #ffc25c33}input.correct{border-color:#74d59a}input.wrong{border-color:#ff8f8f}.feedback{min-height:1.4em;margin:7px 0 0;font-size:.86rem;font-weight:700;color:#bcebc9}.feedback.wrong{color:#ffb1b1}.actions{position:sticky;bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px;padding:13px;background:#291b40f5;border:1px solid #66518f;border-radius:16px;box-shadow:0 8px 24px #10091f88}.btn{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;background:#ffbd50;color:#291638}.btn:hover{background:#ffd180}.btn.secondary{background:#493862;color:#f7f2ff}.btn.secondary:hover{background:#5d4979}.result{margin-left:auto;font-weight:800;color:#ffe0a1}.notice{color:#d4cbea;font-size:.84rem;margin:12px 2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){main{padding:18px 14px 70px}header{margin:24px 0 18px}.grid{grid-template-columns:1fr;gap:10px}.card{padding:14px}.clue{min-height:44px;margin-bottom:10px}.icon{width:44px;height:44px;font-size:1.45rem}.unit-heading{margin-top:26px}.actions{bottom:6px}.actions .btn{flex:1}.result{width:100%;margin:0;text-align:center}}
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Về trang chọn trò chơi</a>
  <header>
    <div class="eyebrow">🎃 Góc luyện tập · Lớp 4</div>
    <h1>Kiểm tra từ vựng</h1>
    <p>Nhìn hình và nghĩa tiếng Việt, rồi viết từ tiếng Anh tương ứng nhé!</p>
    <div class="progress"><div class="bar" aria-hidden="true"><span id="progressBar"></span></div><strong id="progressText">0 / 15 đã điền</strong></div>
  </header>
  <form id="vocabForm" novalidate>
    <div id="questions"></div>
    <div class="actions">
      <button class="btn" type="submit">✨ Kiểm tra bài</button>
      <button class="btn secondary" type="button" id="reset">Làm lại</button>
      <div class="result" id="result" role="status" aria-live="polite"></div>
    </div>
    <p class="notice">Bài làm được tự động lưu trên trình duyệt này.</p>
  </form>
</main>
<script>
const vocabulary = [
  {unit:6, icon:'👥', meaning:'của chúng tôi, của chúng em', answer:'our'},
  {unit:6, icon:'🏡', meaning:'ngôi làng, làng quê', answer:'village'},
  {unit:6, icon:'🏢', meaning:'tòa nhà, cao ốc', answer:'building'},
  {unit:6, icon:'✨', meaning:'nhiều (đếm được)', answer:'many'},
  {unit:6, icon:'🏫', meaning:'cơ sở vật chất, tiện ích', answer:'facility'},
  {unit:6, icon:'🌸', meaning:'bông hoa, hoa', answer:'flower'},
  {unit:6, icon:'🛝', meaning:'sân chơi', answer:'playground'},
  {unit:6, icon:'🏸', meaning:'môn cầu lông', answer:'badminton'},
  {unit:6, icon:'🏐', meaning:'môn bóng chuyền', answer:'volleyball'},
  {unit:6, icon:'⛰️', meaning:'ngọn núi, núi', answer:'mountain'},
  {unit:7, icon:'📅', meaning:'thời khóa biểu', answer:'timetable'},
  {unit:7, icon:'📚', meaning:'môn học', answer:'subject'},
  {unit:7, icon:'🇻🇳', meaning:'môn Tiếng Việt, người Việt Nam', answer:'vietnamese'},
  {unit:7, icon:'📐', meaning:'môn Toán', answer:'maths'},
  {unit:7, icon:'🔬', meaning:'môn Khoa học', answer:'science'}
];
const storageKey = 'halloween-vocab-test-unit6-7-v1';
const questions = document.getElementById('questions');
let checked = false;
for (const unit of [6, 7]) {
  const section = document.createElement('section');
  const count = vocabulary.filter(item => item.unit === unit).length;
  section.innerHTML = `<h2 class="unit-heading">Unit ${unit} <span>${count} từ vựng</span></h2><div class="grid"></div>`;
  const grid = section.querySelector('.grid');
  vocabulary.forEach((item, index) => {
    if (item.unit !== unit) return;
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<div class="clue"><span class="icon" aria-hidden="true">${item.icon}</span><span class="meaning">${item.meaning}</span></div><label for="answer-${index}">Viết từ tiếng Anh</label><input id="answer-${index}" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="feedback-${index}"><p class="feedback" id="feedback-${index}"></p>`;
    grid.appendChild(card);
  });
  questions.appendChild(section);
}
const inputs = vocabulary.map((_, i) => document.getElementById(`answer-${i}`));
const normalise = value => value.trim().toLocaleLowerCase('en-US');
function updateProgress() {
  const filled = inputs.filter(input => input.value.trim()).length;
  document.getElementById('progressText').textContent = `${filled} / ${inputs.length} đã điền`;
  document.getElementById('progressBar').style.width = `${filled / inputs.length * 100}%`;
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify({answers:inputs.map(input => input.value), checked})); } catch (_) {}
}
function grade() {
  let correct = 0;
  inputs.forEach((input, index) => {
    const answer = normalise(input.value);
    const feedback = document.getElementById(`feedback-${index}`);
    const ok = answer === vocabulary[index].answer;
    if (ok) correct++;
    input.classList.toggle('correct', ok); input.classList.toggle('wrong', !ok);
    input.setAttribute('aria-invalid', String(!ok));
    feedback.classList.toggle('wrong', !ok);
    feedback.textContent = ok ? '✓ Chính xác!' : answer ? `Chưa đúng. Đáp án: ${vocabulary[index].answer}` : `Chưa điền. Đáp án: ${vocabulary[index].answer}`;
  });
  document.getElementById('result').textContent = `Kết quả: ${correct} / ${inputs.length} câu đúng`;
}
inputs.forEach(input => input.addEventListener('input', () => {
  if (checked) { checked = false; inputs.forEach((field, i) => { field.classList.remove('correct','wrong'); field.removeAttribute('aria-invalid'); document.getElementById(`feedback-${i}`).textContent = ''; }); document.getElementById('result').textContent = ''; }
  updateProgress(); save();
}));
document.getElementById('vocabForm').addEventListener('submit', event => { event.preventDefault(); checked = true; grade(); save(); });
document.getElementById('reset').addEventListener('click', () => {
  if (!window.confirm('Xóa các câu trả lời để làm lại từ đầu?')) return;
  inputs.forEach((input, i) => { input.value = ''; input.classList.remove('correct','wrong'); input.removeAttribute('aria-invalid'); document.getElementById(`feedback-${i}`).textContent = ''; });
  checked = false; document.getElementById('result').textContent = ''; updateProgress(); save(); inputs[0].focus();
});
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
  if (saved && Array.isArray(saved.answers)) { inputs.forEach((input, i) => { if (typeof saved.answers[i] === 'string') input.value = saved.answers[i]; }); checked = saved.checked === true; if (checked) grade(); }
} catch (_) {}
updateProgress();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lâu đài ma - Lớp 4</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;background:#1f1338;color:#F1EFE8;display:flex;align-items:center;justify-content:center;padding:24px 16px;min-height:100vh}
.wrap{width:min(860px,100%);text-align:center}
.big{font-size:64px;display:inline-block;animation:jump 1.4s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-14px) rotate(-6deg)}}
h1{font-size:clamp(30px,5vw,46px);color:#FAC775;line-height:1.15;margin:4px 0}
.sub{font-size:20px;color:#CECBF6;margin-bottom:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{display:block;text-decoration:none;color:inherit;background:#2a1a45;border:2px solid #EF9F27;border-radius:20px;padding:24px;box-shadow:0 0 30px rgba(239,159,39,.2);transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-4px) scale(1.02);box-shadow:0 0 40px rgba(239,159,39,.45);outline:none}
.card .ic{font-size:60px;line-height:1.1}
.card h2{font-size:26px;color:#FAC775;margin:6px 0}
.card p{font-size:17px;color:#CECBF6;line-height:1.5;margin-bottom:14px}
.card .go{display:inline-block;background:#EF9F27;color:#2a1a45;border-radius:14px;padding:8px 22px;font-size:20px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="big">🎃</div>
  <h1>Lâu đài ma · Lớp 4</h1>
  <p class="sub">Chọn trò chơi em muốn chơi</p>
  <div class="cards">
    <a class="card" href="toan.html">
      <div class="ic">🧮</div>
      <h2>Thoát khỏi lâu đài ma ám</h2>
      <p>Giải toán để mở từng cánh cửa và thoát ra ngoài.</p>
      <span class="go">Chơi toán ➜</span>
    </a>
    <a class="card" href="san-do.html">
      <div class="ic">🔦</div>
      <h2>Săn đồ trong lâu đài ma</h2>
      <p>Tìm đồ vật bị giấu trong căn phòng lộn xộn. Có 30 vòng.</p>
      <span class="go">Tìm đồ vật ➜</span>
    </a>
  </div>
</div>
</body>
</html>
